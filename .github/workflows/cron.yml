name: 15m Auto Sheets Updater

on:
  schedule:
    # Her 15 dakikada bir (Mum kapanışından 1 dakika sonra)
    - cron: '1,16,31,46 * * * *'
  workflow_dispatch:

jobs:
  update-sheets:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cron Runner Scriptini Çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python cron_runner.py
